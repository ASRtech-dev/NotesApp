<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgMap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="suitMap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgMap)"/>

  <!-- Strategic Map Board in Background -->
  <rect x="176" y="24" width="204" height="196" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="176" y="24" width="204" height="24" rx="10" fill="#7c3aed" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="192" cy="36" r="4" fill="#fde68a"/>
  <circle cx="204" cy="36" r="4" fill="#a7f3d0"/>
  <rect x="218" y="33" width="90" height="6" rx="3" fill="#ede9fe"/>

  <!-- Connected Map Nodes on Board -->
  <path d="M242 92 L298 82" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M242 92 L288 148" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M326 98 L316 148" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Node 1 (Master) -->
  <rect x="194" y="68" width="64" height="44" rx="7" fill="#fef3c7" stroke="#1e293b" stroke-width="2.2"/>
  <rect x="202" y="76" width="32" height="6" rx="3" fill="#d97706"/>
  <rect x="202" y="88" width="46" height="5" rx="2.5" fill="#78716c"/>
  <rect x="202" y="97" width="38" height="5" rx="2.5" fill="#a8a29e"/>

  <!-- Node 2 -->
  <rect x="296" y="62" width="68" height="44" rx="7" fill="#f3e8ff" stroke="#1e293b" stroke-width="2.2"/>
  <rect x="304" y="70" width="36" height="6" rx="3" fill="#7c3aed"/>
  <rect x="304" y="82" width="50" height="5" rx="2.5" fill="#64748b"/>
  <rect x="304" y="91" width="40" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- Node 3 -->
  <rect x="266" y="138" width="84" height="52" rx="7" fill="#ecfdf5" stroke="#1e293b" stroke-width="2.2"/>
  <rect x="276" y="147" width="44" height="6" rx="3" fill="#10b981"/>
  <rect x="276" y="159" width="64" height="5" rx="2.5" fill="#64748b"/>
  <rect x="276" y="169" width="52" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- Character: Curriculum & Knowledge Architect -->
  <path d="M42 288 C48 206 72 182 114 182 C152 182 172 204 182 288 Z" fill="url(#suitMap)" stroke="#1e293b" stroke-width="2.6"/>
  <!-- Collar -->
  <polygon points="96,182 114,210 132,182" fill="#fde68a" stroke="#1e293b" stroke-width="2.2"/>
  <!-- Neck & Head -->
  <rect x="102" y="152" width="24" height="32" rx="8" fill="#e6b18a" stroke="#1e293b" stroke-width="2.4"/>
  <!-- Hair Back -->
  <path d="M74 112 C70 72 156 72 152 116 C150 146 156 168 144 174 L82 174 C72 164 76 138 74 112 Z" fill="#1e1b4b" stroke="#1e293b" stroke-width="2.4"/>
  <!-- Face -->
  <path d="M84 110 C84 82 144 82 144 110 C144 142 132 160 114 160 C96 160 84 142 84 110 Z" fill="#f1c29d" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Hair Front Bangs -->
  <path d="M82 108 C88 86 112 84 144 104 C144 80 124 72 106 74 C88 76 80 90 82 108 Z" fill="#1e1b4b" stroke="#1e293b" stroke-width="2.2"/>
  <!-- Eyes & Focused Expression -->
  <path d="M95 106 L109 108" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M121 108 L135 106" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="102" cy="115" r="2.5" fill="#1e293b"/>
  <circle cx="127" cy="115" r="2.5" fill="#1e293b"/>
  <path d="M115 117 L113 129 L118 130" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M106 142 Q115 145 123 141" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Arm pointing to the Content Map Board with pointer stylus -->
  <path d="M148 202 L202 158 L212 168 L162 226 Z" fill="#6d28d9" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="208" cy="160" r="8" fill="#f1c29d" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="212" y1="156" x2="236" y2="128" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
</svg>
